<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#11110f" />
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#11110f;touch-action:none}
    canvas{display:block;width:100%;height:100%}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11110f);

const camera = new THREE.OrthographicCamera(-3.6,3.6,2.8,-2.8,0.1,50);
camera.position.set(0,10,0);
camera.up.set(0,0,-1);
camera.lookAt(0,0,0);

function updateCamera(){
  const aspect = innerWidth/innerHeight;
  const halfH = 2.55;
  camera.top = halfH;
  camera.bottom = -halfH;
  camera.left = -halfH*aspect;
  camera.right = halfH*aspect;
  camera.updateProjectionMatrix();
}
updateCamera();

scene.add(new THREE.HemisphereLight(0xe2ddd0,0x171714,1.35));

const key = new THREE.DirectionalLight(0xfff2d5,3.8);
key.position.set(-4.5,8,3.5);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
scene.add(key);

const fill = new THREE.DirectionalLight(0xaab8d0,1.5);
fill.position.set(4,5,-4);
scene.add(fill);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40,40),
  new THREE.MeshStandardMaterial({ color:0x23221e, roughness:0.97, metalness:0.02 })
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1.22;
floor.receiveShadow = true;
scene.add(floor);

const device = new THREE.Group();
scene.add(device);

const bodyMat = new THREE.MeshPhysicalMaterial({ color:0x242522, roughness:0.48, metalness:0.18, clearcoat:0.12, clearcoatRoughness:0.7 });
const edgeMat = new THREE.MeshPhysicalMaterial({ color:0x121310, roughness:0.72, metalness:0.12 });
const plateMat = new THREE.MeshPhysicalMaterial({ color:0x343530, roughness:0.31, metalness:0.48 });
const blackMat = new THREE.MeshPhysicalMaterial({ color:0x090a09, roughness:0.26, metalness:0.1 });
const glassMat = new THREE.MeshPhysicalMaterial({ color:0x0d1514, roughness:0.12, metalness:0.2, clearcoat:1, clearcoatRoughness:0.08 });

function roundedBox(w,h,d,r=0.14,segments=4,material=bodyMat){
  const s = new THREE.Shape();
  const x=-w/2,y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  const g = new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSegments:segments,steps:1,bevelSize:r*0.35,bevelThickness:r*0.35,curveSegments:8});
  g.center();
  return new THREE.Mesh(g,material);
}

const body = roundedBox(5.8,3.55,1.38,0.23,4,bodyMat);
body.rotation.x = Math.PI/2;
body.position.y = -0.42;
body.castShadow = body.receiveShadow = true;
device.add(body);

const top = roundedBox(5.35,3.08,0.16,0.15,3,plateMat);
top.rotation.x = Math.PI/2;
top.position.y = 0.34;
top.castShadow = top.receiveShadow = true;
device.add(top);

const screen = roundedBox(2.85,0.82,0.07,0.08,3,glassMat);
screen.rotation.x = Math.PI/2;
screen.position.set(-0.62,0.455,-0.72);
device.add(screen);

const screenGlow = new THREE.Mesh(new THREE.PlaneGeometry(2.45,0.48),new THREE.MeshBasicMaterial({color:0x61746a,transparent:true,opacity:0.14}));
screenGlow.rotation.x = -Math.PI/2;
screenGlow.position.set(-0.62,0.501,-0.72);
device.add(screenGlow);

const interactive=[];

function knob(x,z,r=0.33,h=0.27){
  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(r*0.35,r*0.38,h*0.72,32),edgeMat);
  stem.position.y = 0.48;
  stem.castShadow = true;
  g.add(stem);
  const k = new THREE.Mesh(new THREE.CylinderGeometry(r,r*0.94,h,48),blackMat.clone());
  k.position.y = 0.64;
  k.castShadow = true;
  g.add(k);
  const mark = new THREE.Mesh(new THREE.BoxGeometry(0.035,0.018,r*0.52),new THREE.MeshStandardMaterial({color:0xc7c3b5,roughness:0.5}));
  mark.position.set(0,0.785,-r*0.18);
  g.add(mark);
  g.position.set(x,0,z);
  g.userData.kind='knob';
  g.userData.value=0;
  g.userData.hit=k;
  device.add(g);
  interactive.push(k);
  k.userData.owner=g;
  return g;
}

const knobs=[
  knob(1.76,-0.93,0.36),
  knob(2.30,-0.15,0.30),
  knob(1.76,0.64,0.30),
  knob(0.82,0.66,0.25)
];

function button(x,z,w=0.38,d=0.38){
  const m = roundedBox(w,d,0.11,0.06,2,edgeMat.clone());
  m.rotation.x = Math.PI/2;
  m.position.set(x,0.52,z);
  m.castShadow = true;
  m.userData.kind='button';
  m.userData.on=false;
  device.add(m);
  interactive.push(m);
  return m;
}

const buttons=[
  button(-2.14,0.73,0.55,0.55),
  button(-1.42,0.73,0.55,0.55),
  button(-0.70,0.73,0.55,0.55)
];

const leds=[];
for(let i=0;i<5;i++){
  const led = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.045,24),new THREE.MeshStandardMaterial({color:0x6d745a,emissive:0x8b9a62,emissiveIntensity:i===0?2.8:0.2,roughness:0.35}));
  led.position.set(-2.05+i*0.36,0.57,-1.25);
  device.add(led);
  leds.push(led);
}

for(const x of [-2.55,2.55]) for(const z of [-1.45,1.45]){
  const screw = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.035,24),new THREE.MeshStandardMaterial({color:0x77776f,roughness:0.3,metalness:0.85}));
  screw.position.set(x,0.51,z);
  device.add(screw);
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let activeKnob=null;
let dragStartY=0;
let dragStartValue=0;

function pick(e){
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  return raycaster.intersectObjects(interactive,false)[0]?.object || null;
}

renderer.domElement.addEventListener('pointerdown',e=>{
  renderer.domElement.setPointerCapture?.(e.pointerId);
  const hit=pick(e);
  if(!hit) return;
  const owner=hit.userData.owner || hit;

  if(owner.userData.kind==='button'){
    owner.userData.on=!owner.userData.on;
    owner.position.y=owner.userData.on?0.47:0.52;
    owner.material.color.setHex(owner.userData.on?0x4a5145:0x121310);
    const index=buttons.indexOf(owner);
    if(index>=0 && leds[index]) leds[index].material.emissiveIntensity=owner.userData.on?3.6:0.18;
  }

  if(owner.userData.kind==='knob'){
    activeKnob=owner;
    dragStartY=e.clientY;
    dragStartValue=owner.userData.value;
  }
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(!activeKnob) return;
  const delta=(dragStartY-e.clientY)*0.012;
  activeKnob.userData.value=THREE.MathUtils.clamp(dragStartValue+delta,-1,1);
  activeKnob.rotation.y=activeKnob.userData.value*Math.PI*0.78;
});

function endPointer(){ activeKnob=null; }
renderer.domElement.addEventListener('pointerup',endPointer);
renderer.domElement.addEventListener('pointercancel',endPointer);

let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=0.016;
  if(!buttons[0].userData.on){
    const pulse=(Math.sin(t*2.2)+1)*0.5;
    leds[0].material.emissiveIntensity=1.5+pulse*2.2;
    screenGlow.material.opacity=0.09+pulse*0.05;
  }else{
    screenGlow.material.opacity=0.16;
  }
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  updateCamera();
});
</script>
</body>
</html>
