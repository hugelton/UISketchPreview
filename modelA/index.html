<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#11110f" />
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#11110f;touch-action:none}
    canvas{display:block;width:100%;height:100%}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11110f);
scene.fog = new THREE.FogExp2(0x11110f,0.032);

const camera = new THREE.PerspectiveCamera(34,innerWidth/innerHeight,0.1,100);
camera.position.set(6.6,5.3,7.7);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minDistance = 5.2;
controls.maxDistance = 13;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = 1.42;
controls.target.set(0,0.35,0);

scene.add(new THREE.HemisphereLight(0xd9d4c6,0x171714,1.25));

const key = new THREE.DirectionalLight(0xfff2d5,4.0);
key.position.set(-4.5,7,3.5);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
scene.add(key);

const rim = new THREE.PointLight(0xa8b8ff,18,15,2);
rim.position.set(5,2.8,-4);
scene.add(rim);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40,40),
  new THREE.MeshStandardMaterial({ color:0x23221e, roughness:0.97, metalness:0.02 })
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1.22;
floor.receiveShadow = true;
scene.add(floor);

const device = new THREE.Group();
scene.add(device);

const bodyMat = new THREE.MeshPhysicalMaterial({
  color:0x242522, roughness:0.48, metalness:0.18,
  clearcoat:0.12, clearcoatRoughness:0.7
});
const edgeMat = new THREE.MeshPhysicalMaterial({ color:0x121310, roughness:0.72, metalness:0.12 });
const plateMat = new THREE.MeshPhysicalMaterial({ color:0x343530, roughness:0.31, metalness:0.48 });
const blackMat = new THREE.MeshPhysicalMaterial({ color:0x090a09, roughness:0.26, metalness:0.1 });
const glassMat = new THREE.MeshPhysicalMaterial({ color:0x0d1514, roughness:0.12, metalness:0.2, clearcoat:1, clearcoatRoughness:0.08 });

function roundedBox(w,h,d,r=0.14,segments=4,material=bodyMat){
  const s = new THREE.Shape();
  const x=-w/2,y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  const g = new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSegments:segments,steps:1,bevelSize:r*0.35,bevelThickness:r*0.35,curveSegments:8});
  g.center();
  return new THREE.Mesh(g,material);
}

const body = roundedBox(5.8,3.55,1.38,0.23,4,bodyMat);
body.rotation.x = Math.PI/2;
body.position.y = -0.42;
body.castShadow = body.receiveShadow = true;
device.add(body);

const top = roundedBox(5.35,3.08,0.16,0.15,3,plateMat);
top.rotation.x = Math.PI/2;
top.position.y = 0.34;
top.castShadow = top.receiveShadow = true;
device.add(top);

const screen = roundedBox(2.85,0.82,0.07,0.08,3,glassMat);
screen.rotation.x = Math.PI/2;
screen.position.set(-0.62,0.455,-0.72);
device.add(screen);

const screenGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(2.45,0.48),
  new THREE.MeshBasicMaterial({color:0x61746a,transparent:true,opacity:0.14})
);
screenGlow.rotation.x = -Math.PI/2;
screenGlow.position.set(-0.62,0.501,-0.72);
device.add(screenGlow);

function knob(x,z,r=0.33,h=0.27){
  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(r*0.35,r*0.38,h*0.72,32),edgeMat);
  stem.position.y = 0.48;
  stem.castShadow = true;
  g.add(stem);
  const k = new THREE.Mesh(new THREE.CylinderGeometry(r,r*0.94,h,48),blackMat);
  k.position.y = 0.64;
  k.castShadow = true;
  g.add(k);
  const mark = new THREE.Mesh(new THREE.BoxGeometry(0.035,0.018,r*0.52),new THREE.MeshStandardMaterial({color:0xc7c3b5,roughness:0.5}));
  mark.position.set(0,0.785,-r*0.18);
  g.add(mark);
  g.position.set(x,0,z);
  device.add(g);
  return g;
}

knob(1.76,-0.93,0.36);
knob(2.30,-0.15,0.30);
knob(1.76,0.64,0.30);
knob(0.82,0.66,0.25);

function button(x,z,w=0.38,d=0.38){
  const m = roundedBox(w,d,0.11,0.06,2,edgeMat);
  m.rotation.x = Math.PI/2;
  m.position.set(x,0.52,z);
  m.castShadow = true;
  device.add(m);
  return m;
}

button(-2.14,0.73,0.55,0.55);
button(-1.42,0.73,0.55,0.55);
button(-0.70,0.73,0.55,0.55);

const leds=[];
for(let i=0;i<5;i++){
  const led = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07,0.07,0.045,24),
    new THREE.MeshStandardMaterial({color:0x6d745a,emissive:0x8b9a62,emissiveIntensity:i===0?2.8:0.2,roughness:0.35})
  );
  led.position.set(-2.05+i*0.36,0.57,-1.25);
  device.add(led);
  leds.push(led);
}

for(const x of [-2.55,2.55]) for(const z of [-1.45,1.45]){
  const screw = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.035,24),new THREE.MeshStandardMaterial({color:0x77776f,roughness:0.3,metalness:0.85}));
  screw.position.set(x,0.51,z);
  device.add(screw);
}

let orientEnabled=false;
let beta=0,gamma=0;
async function enableOrientation(){
  if(orientEnabled) return;
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=='granted') return;
    }
    addEventListener('deviceorientation',e=>{
      beta=THREE.MathUtils.clamp(e.beta||0,-45,45);
      gamma=THREE.MathUtils.clamp(e.gamma||0,-45,45);
    },true);
    orientEnabled=true;
  }catch(_){ }
}
renderer.domElement.addEventListener('pointerdown',enableOrientation,{once:true});

let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=0.016;
  if(orientEnabled && !controls.state){
    device.rotation.z += ((-gamma*0.0025)-device.rotation.z)*0.035;
    device.rotation.x += ((beta*0.0015)-device.rotation.x)*0.035;
  }
  const pulse=(Math.sin(t*2.2)+1)*0.5;
  leds[0].material.emissiveIntensity=1.5+pulse*2.2;
  screenGlow.material.opacity=0.09+pulse*0.05;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
