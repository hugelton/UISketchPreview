<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111;touch-action:none}
    canvas{display:block;width:100%;height:100%}
  </style>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

// Geometry is specified in mils. 1 mil = 0.001 inch = 0.0254 mm.
const UNIT_PER_MIL = 0.00254;
const mil = n => n * UNIT_PER_MIL;

const COUNT = 12;
const BUTTON_PITCH = 300;      // mil, center-to-center
const BUTTON_D = 138;          // ~3.5 mm
const BUTTON_H = 197;          // ~5.0 mm
const LED_D = 118;             // ~3.0 mm
const LED_Y_OFFSET = 200;      // button center -> LED center, mil

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.OrthographicCamera(-4,4,2,-2,0.1,100);
camera.position.set(0,10,0);
camera.up.set(0,0,-1);
camera.lookAt(0,0,0);

const rowWidth = mil((COUNT - 1) * BUTTON_PITCH + BUTTON_D);
const marginX = mil(220);
const panelWidth = rowWidth + marginX * 2;
const panelDepth = mil(900);

function updateCamera(){
  const aspect = innerWidth / innerHeight;
  const halfW = panelWidth * 0.53;
  const minHalfH = panelDepth * 0.58;
  const halfH = Math.max(halfW / aspect, minHalfH);
  camera.left = -halfW;
  camera.right = halfW;
  camera.top = halfH;
  camera.bottom = -halfH;
  camera.updateProjectionMatrix();
}
updateCamera();

scene.add(new THREE.HemisphereLight(0xffffff,0x222222,1.45));
const key = new THREE.DirectionalLight(0xffffff,2.4);
key.position.set(-3,8,4);
key.castShadow = true;
scene.add(key);

const plane = new THREE.Mesh(
  new THREE.PlaneGeometry(panelWidth,panelDepth),
  new THREE.MeshStandardMaterial({color:0x343434,roughness:0.9,metalness:0.01})
);
plane.rotation.x = -Math.PI/2;
plane.receiveShadow = true;
scene.add(plane);

const buttonBaseColor = 0x353535;
const buttonPressedColor = 0x292929;
const ledOff = new THREE.Color(0x7d1010);
const ledOn = new THREE.Color(0xff2020);

const buttons=[];
const leds=[];
const interactive=[];
const startX = -mil((COUNT - 1) * BUTTON_PITCH) / 2;
const buttonZ = mil(100);
const ledZ = buttonZ - mil(LED_Y_OFFSET);

for(let i=0;i<COUNT;i++){
  const x = startX + mil(i * BUTTON_PITCH);

  const button = new THREE.Mesh(
    new THREE.CylinderGeometry(mil(BUTTON_D)/2,mil(BUTTON_D)/2,mil(BUTTON_H),48),
    new THREE.MeshStandardMaterial({color:buttonBaseColor,roughness:0.78,metalness:0.04})
  );
  button.position.set(x,mil(BUTTON_H)/2,buttonZ);
  button.castShadow = true;
  button.userData.index = i;
  button.userData.on = false;
  scene.add(button);
  buttons.push(button);
  interactive.push(button);

  const ledMat = new THREE.MeshPhysicalMaterial({
    color:ledOff,
    emissive:ledOff,
    emissiveIntensity:0.3,
    roughness:0.16,
    metalness:0.0,
    clearcoat:1.0,
    clearcoatRoughness:0.08
  });

  // Upper hemisphere: equator sits on the panel and the dome rises upward.
  const led = new THREE.Mesh(
    new THREE.SphereGeometry(mil(LED_D)/2,40,24,0,Math.PI*2,0,Math.PI/2),
    ledMat
  );
  led.position.set(x,0,ledZ);
  led.castShadow = true;
  scene.add(led);
  leds.push(led);
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX-r.left)/r.width)*2-1;
  pointer.y = -((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  return raycaster.intersectObjects(interactive,false)[0]?.object || null;
}

renderer.domElement.addEventListener('pointerdown',e=>{
  const button = pick(e);
  if(!button) return;

  const i = button.userData.index;
  button.userData.on = !button.userData.on;
  button.position.y = button.userData.on ? mil(BUTTON_H)/2 - mil(35) : mil(BUTTON_H)/2;
  button.material.color.setHex(button.userData.on ? buttonPressedColor : buttonBaseColor);

  leds[i].material.color.copy(button.userData.on ? ledOn : ledOff);
  leds[i].material.emissive.copy(button.userData.on ? ledOn : ledOff);
  leds[i].material.emissiveIntensity = button.userData.on ? 4.5 : 0.3;
});

function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  updateCamera();
});
</script>
</body>
</html>
