<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111;touch-action:none}
    canvas{display:block;width:100%;height:100%}
  </style>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const MM = 0.1;
const PITCH = 5.08 * MM;
const BUTTON_D = 3.5 * MM;
const BUTTON_H = 5.0 * MM;
const LED_D = 3.0 * MM;
const LED_OFFSET = 5.08 * MM;

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.OrthographicCamera(-4,4,2,-2,0.1,100);
camera.position.set(0,10,0);
camera.up.set(0,0,-1);
camera.lookAt(0,0,0);

function updateCamera(){
  const spanX = 12 * PITCH + 1.6;
  const aspect = innerWidth / innerHeight;
  const halfW = spanX * 0.5;
  const halfH = halfW / aspect;
  camera.left = -halfW;
  camera.right = halfW;
  camera.top = halfH;
  camera.bottom = -halfH;
  camera.updateProjectionMatrix();
}
updateCamera();

scene.add(new THREE.HemisphereLight(0xffffff,0x222222,1.5));
const key = new THREE.DirectionalLight(0xffffff,2.8);
key.position.set(-3,8,4);
key.castShadow = true;
scene.add(key);

const plane = new THREE.Mesh(
  new THREE.PlaneGeometry(12*PITCH+1.4,2.2),
  new THREE.MeshStandardMaterial({color:0x292929,roughness:0.92,metalness:0.02})
);
plane.rotation.x = -Math.PI/2;
plane.receiveShadow = true;
scene.add(plane);

const buttonMat = new THREE.MeshStandardMaterial({color:0x303030,roughness:0.78,metalness:0.05});
const ledOff = new THREE.Color(0x5a1111);
const ledOn = new THREE.Color(0xff2020);

const buttons=[];
const leds=[];
const interactive=[];
const startX = -((12-1)*PITCH)/2;

for(let i=0;i<12;i++){
  const x = startX + i*PITCH;

  const button = new THREE.Mesh(
    new THREE.CylinderGeometry(BUTTON_D/2,BUTTON_D/2,BUTTON_H,48),
    buttonMat.clone()
  );
  button.position.set(x,BUTTON_H/2,0.28);
  button.castShadow = true;
  button.userData.index = i;
  button.userData.on = false;
  scene.add(button);
  buttons.push(button);
  interactive.push(button);

  const ledMat = new THREE.MeshStandardMaterial({
    color:ledOff,
    emissive:ledOff,
    emissiveIntensity:0.15,
    roughness:0.35
  });
  const led = new THREE.Mesh(
    new THREE.SphereGeometry(LED_D/2,32,20,0,Math.PI*2,0,Math.PI/2),
    ledMat
  );
  led.position.set(x,0.02,0.28-LED_OFFSET);
  led.rotation.x = Math.PI;
  scene.add(led);
  leds.push(led);
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX-r.left)/r.width)*2-1;
  pointer.y = -((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  return raycaster.intersectObjects(interactive,false)[0]?.object || null;
}

renderer.domElement.addEventListener('pointerdown',e=>{
  const button = pick(e);
  if(!button) return;
  const i = button.userData.index;
  button.userData.on = !button.userData.on;
  button.position.y = button.userData.on ? BUTTON_H/2 - 0.09 : BUTTON_H/2;
  button.material.color.setHex(button.userData.on ? 0x252525 : 0x303030);
  leds[i].material.color.copy(button.userData.on ? ledOn : ledOff);
  leds[i].material.emissive.copy(button.userData.on ? ledOn : ledOff);
  leds[i].material.emissiveIntensity = button.userData.on ? 4.0 : 0.15;
});

function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  updateCamera();
});
</script>
</body>
</html>
